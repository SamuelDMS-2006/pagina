<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Te amo mi niña</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Quicksand:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Música -->
    <audio id="music" loop preload="auto">
      <source src="audio/cant-help-falling-in-love.mp3" type="audio/mpeg" />
    </audio>

    <main>
      <h1>Sé que estás muy triste, pero quiero que sepas que estoy aquí</h1>

      <p class="sub">
        Siempre puedes contar conmigo, y aunque no pueda solucionar todo, quiero
        que sepas que te acompaño en lo que necesites mi niña 💞.
      </p>

      <button id="btn" type="button">Toca aquí 💞</button>

      <div id="stage" aria-live="polite">
        <div class="dog-wrap" id="dogWrap">
          <span class="note n1" aria-hidden="true">🎵</span>
          <span class="note n2" aria-hidden="true">🎶</span>
          <span class="note n3" aria-hidden="true">🎵</span>

          <span class="dog" role="img" aria-label="Un perrito bailando">
            🐶
          </span>

          <div class="shadow"></div>
        </div>

        <div class="msg" id="msg"></div>
      </div>

      <!-- CARRUSEL -->

      <section class="carousel" aria-label="Carrusel de recuerdos">
        <h2>Tú y yo, siempre 💞</h2>

        <div class="track" id="track" tabindex="0">
          <figure class="slide">
            <img src="image/4.jpeg" alt="Nuestro recuerdo" />
          </figure>

          <figure class="slide">
            <img src="image/2.jpeg" alt="Nuestro recuerdo" />
          </figure>

          <figure class="slide">
            <img src="image/3.jpeg" alt="Nuestro recuerdo" />
          </figure>

          <figure class="slide">
            <img src="image/1.jpeg" alt="Nuestro recuerdo" />
          </figure>

          <figure class="slide">
            <img src="image/5.jpeg" alt="Nuestro recuerdo" />
          </figure>
        </div>

        <div class="nav">
          <button class="arrow" id="prev" type="button" aria-label="Anterior">
            ‹
          </button>

          <div class="dots" id="dots" aria-hidden="true"></div>

          <button class="arrow" id="next" type="button" aria-label="Siguiente">
            ›
          </button>
        </div>
      </section>
    </main>

    <script>
      (function () {
        var btn = document.getElementById("btn");
        var wrap = document.getElementById("dogWrap");
        var msg = document.getElementById("msg");
        var music = document.getElementById("music");

        var i = 0;
        var first = true;

        /* =========================
           MÚSICA
        ========================== */

        function playMusic() {
          music.volume = 0.6;

          music.play().catch(function () {
            console.log(
              "El navegador requiere interacción para reproducir la música.",
            );
          });
        }

        /* =========================
           CORAZONES
        ========================== */

        function hearts() {
          var rm =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;

          if (rm) return;

          for (var k = 0; k < 14; k++) {
            var h = document.createElement("span");

            h.className = "heart";

            h.textContent = ["💞", "💖", "💕"][k % 3];

            h.style.left = Math.random() * 95 + "vw";

            h.style.animationDelay = Math.random() * 1.2 + "s";

            document.body.appendChild(h);

            setTimeout(
              function (el) {
                el.remove();
              }.bind(null, h),

              5200,
            );
          }
        }

        /* =========================
           BOTÓN PRINCIPAL
        ========================== */

        btn.addEventListener("click", function () {
          /* Iniciar música */
          playMusic();

          wrap.classList.add("on");

          i++;

          if (first) {
            btn.textContent = "Otra vez 💕";

            first = false;
          }

          hearts();
        });

        /* =========================
           CARRUSEL
        ========================== */

        var track = document.getElementById("track");

        var dots = document.getElementById("dots");

        function buildDots() {
          dots.innerHTML = "";

          for (var d = 0; d < track.children.length; d++) {
            dots.appendChild(document.createElement("i"));
          }

          mark();
        }

        function mark() {
          var w = track.clientWidth + 16;

          var idx = Math.round(track.scrollLeft / w);

          for (var d = 0; d < dots.children.length; d++) {
            dots.children[d].className = d === idx ? "on" : "";
          }
        }

        function go(dir) {
          track.scrollBy({
            left: dir * (track.clientWidth + 16),

            behavior: "smooth",
          });
        }

        document.getElementById("prev").addEventListener("click", function () {
          go(-1);
        });

        document.getElementById("next").addEventListener("click", function () {
          go(1);
        });

        track.addEventListener("scroll", mark);

        track.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight") {
            go(1);
          }

          if (e.key === "ArrowLeft") {
            go(-1);
          }
        });

        /* =========================
           AGREGAR FOTOS
        ========================== */

        document
          .getElementById("pics")
          .addEventListener("change", function (e) {
            var files = Array.prototype.slice.call(e.target.files);

            if (!files.length) return;

            track.innerHTML = "";

            files.forEach(function (f) {
              var r = new FileReader();

              r.onload = function () {
                var fig = document.createElement("figure");

                fig.className = "slide";

                var img = document.createElement("img");

                img.src = r.result;

                img.alt = "Recuerdo";

                fig.appendChild(img);

                track.appendChild(fig);

                buildDots();
              };

              r.readAsDataURL(f);
            });
          });

        buildDots();
      })();
    </script>
  </body>
</html>
